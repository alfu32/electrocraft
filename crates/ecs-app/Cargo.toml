[package]
name = "ecs-app"
description = "Electrocraft desktop application"
version = "0.1.14"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "electrocraft"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
ecs-render.workspace = true
serde.workspace = true
serde_json.workspace = true
ecs-schematic.workspace = true
ecs-sim.workspace = true
ecs-lib.workspace = true
ecs-mcu.workspace = true
ecs-model.workspace = true
ecs-units.workspace = true
ecs-script.workspace = true
ecs-spice.workspace = true
ecs-expr.workspace = true
ecs-catalog.workspace = true
ecs-mcp.workspace = true
egui_plot.workspace = true
image.workspace = true
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
