  <circle cx="104" cy="256" r="16" fill="#8FB8E0"/>
  <circle cx="408" cy="256" r="16" fill="#8FB8E0"/>
  <!-- current dots -->
  <circle cx="104" cy="186" r="9" fill="#FFE066"/>
  <circle cx="104" cy="330" r="9" fill="#FFE066"/>
  <circle cx="190" cy="400" r="9" fill="#FFE066"/>
  <circle cx="322" cy="400" r="9" fill="#FFE066"/>
  <circle cx="408" cy="330" r="9" fill="#FFE066"/>
  <circle cx="408" cy="186" r="9" fill="#FFE066"/>
  <!-- bolt -->
  <circle cx="256" cy="268" r="118" fill="url(#glow)"/>
  <path d="M286 152 L196 284 H252 L224 384 L322 240 H266 L296 152 Z" fill="url(#bolt)" stroke="#DDF0FF" stroke-width="6" stroke-linejoin="round"/>
