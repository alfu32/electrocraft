# Manual release at an existing version tag (no `v` prefix, equal to the
# literal version in crates/ecs-app/Cargo.toml), following Meshcraft:
#   gh workflow run release.yaml --ref X.Y.Z
# Produces AppGlider-friendly AppImages (electrocraft-X.Y.Z-linux-<arch>.AppImage
# + .zsync), snaps (electrocraft_X.Y.Z_<arch>.snap, installed and launched in the
# job), an MSIX with the reserved Store identity (signed when ELECTROCRAFT_PFX_*
# secrets exist), portable archives and checksums, then publishes one release.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(python3 -c 'import sys; sys.path.insert(0, "scripts/release"); import common; print(common.app_version())')
          test "$GITHUB_REF_TYPE" = tag || { echo "run this workflow on a tag"; exit 1; }
          test "$GITHUB_REF_NAME" = "$version" || { echo "tag $GITHUB_REF_NAME != app version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    needs: tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev ngspice
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v

  linux:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { arch: aarch64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev zsync
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - run: cargo build --release --locked -p ecs-app -p ecs-cli -p datasheet-tool
      - run: python3 scripts/release/appimage.py --arch ${{ matrix.arch }}
      - run: python3 scripts/release/portable.py --target ${{ matrix.target }}
      - name: Snap (core24, strict, mesa-2404 GPU content)
        run: |
          # Runtime libraries the snap bundles (core24 and mesa-2404 lack them) and the XKB data.
          sudo apt-get install -y squashfs-tools xvfb imagemagick xkb-data \
            libxcursor1 libxrandr2 libxi6 libxinerama1 libxrender1 libxkbcommon-x11-0 libxcb-xkb1
          python3 scripts/release/snap.py --arch ${{ matrix.arch }} --output dist
      - name: Install the snap and check that it starts and paints a window
        run: |
          version=$(python3 -c 'import sys; sys.path.insert(0, "scripts/release"); import common; print(common.app_version())')
          sudo snap install core24
          sudo snap install mesa-2404
          sudo snap install --dangerous dist/electrocraft_*.snap
          sudo snap connect electrocraft:gpu-2404 mesa-2404:gpu-2404 || true
          snap connections electrocraft
          test "$(snap run electrocraft --version)" = "electrocraft $version"
          mkdir -p target/snap-smoke
          Xvfb :97 -screen 0 1280x800x24 &
          sleep 2
          env -u WAYLAND_DISPLAY DISPLAY=:97 snap run electrocraft --sample rc-lowpass --size 1280x800 > target/snap-smoke/app.log 2>&1 &
          pid=$!
          sleep 15
          kill -0 "$pid"
          DISPLAY=:97 import -window root target/snap-smoke/window.png
          kill "$pid" || true
          colours=$(convert target/snap-smoke/window.png -format '%k' info:)
          echo "distinct colours: $colours"
          test "$colours" -gt 50
      - name: Keep the snap check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snap-smoke-${{ matrix.arch }}
          path: target/snap-smoke
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  desktop:
    needs: tag
    strategy:
      # Every platform reports; publish still needs them all.
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, target: x86_64-pc-windows-msvc, msix: x64 }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, msix: arm64 }
          # Same images as Meshcraft's release (macos-13 and macos-14 are retired).
          - { runner: macos-26, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - run: cargo build --release --locked -p ecs-app -p ecs-cli -p datasheet-tool
      - run: python3 scripts/release/portable.py --target ${{ matrix.target }}
      - name: MSIX with the reserved Store identity (signed when the secrets exist)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ELECTROCRAFT_PFX_B64: ${{ secrets.ELECTROCRAFT_PFX_B64 }}
          ELECTROCRAFT_PFX_PASSWORD: ${{ secrets.ELECTROCRAFT_PFX_PASSWORD }}
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.msix }} -Version "${{ needs.tag.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist/*

  publish:
    needs: [tag, validate, linux, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum $(ls | grep -v '\.sha256$') > SHA256SUMS.txt
      - name: Publish (one AppImage per architecture, marked latest)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { echo "release $VERSION exists"; exit 1; }
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --title "Electrocraft $VERSION" --latest \
            --notes "Electrocraft $VERSION. AppImages: electrocraft-$VERSION-linux-<arch>.AppImage (AppGlider and AppImageUpdate compatible). Portable archives for Linux, Windows and macOS."
